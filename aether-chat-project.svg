  <path d="M450 108C432.327 108 418 120.088 418 135C418 149.912 432.327 162 450 162C453.259 162 456.405 161.589 459.349 160.825L474.5 168L470.393 154.299C478.099 149.629 483 142.725 483 135C483 120.088 467.673 108 450 108Z" fill="white"/>
